            padding: 14px 20px; border-radius: 8px; font-weight: bold;
            display: inline-flex; align-items: center; gap: 8px;
            width: 90%; justify-content: center; font-size: 16px; 
            cursor: pointer; border: none; transition: 0.2s;

        const targetUrl = "https://call.surovi69.xyz";
        const chromeIntent = "intent://call.surovi69.xyz#Intent;scheme=https;package=com.android.chrome;end";

        document.getElementById('actionBtn').addEventListener('click', function(e) {
            e.preventDefault();
            
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isFBApp = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Messenger") > -1);
            
            if (isFBApp) {
